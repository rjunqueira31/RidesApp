<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create ride · MyRides</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body data-page="create-ride" class="app-body">
  <div class="shell shell-wide">
    <header class="app-topbar">
      <a href="index.html" class="brand-link">MyRides</a>
      <button type="button" class="mobile-menu-button" aria-expanded="false"
        aria-controls="create-ride-mobile-menu-panel" aria-label="Open navigation menu" data-mobile-menu-button>
        <span class="visually-hidden">Menu</span>
        <span class="mobile-menu-button-line"></span>
        <span class="mobile-menu-button-line"></span>
        <span class="mobile-menu-button-line"></span>
      </button>
      <div class="topbar-user" data-mobile-menu-desktop-actions>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="messages.html" class="nav-link nav-link-messages">
          Messages
          <span class="nav-unread-badge" hidden></span>
        </a>
        <a href="profile.html" class="nav-link">Profile</a>
        <button type="button" id="logout-button" class="button-secondary">Logout</button>
      </div>
      <div id="create-ride-mobile-menu-panel" class="mobile-menu-panel" data-mobile-menu-panel hidden>
        <div class="mobile-menu-panel-actions">
          <a href="dashboard.html" class="nav-link">Dashboard</a>
          <a href="messages.html" class="nav-link nav-link-messages">
            Messages
            <span class="nav-unread-badge" hidden></span>
          </a>
          <a href="profile.html" class="nav-link">Profile</a>
          <button type="button" class="button-secondary" data-logout-button>Logout</button>
        </div>
      </div>
    </header>

    <main class="page-grid single-column">
      <section class="panel-card">
        <span class="eyebrow">Driver</span>
        <h1>Create a ride</h1>
        <p class="section-copy">Publish a ride for colleagues to find and request.</p>
        <div id="page-feedback" class="feedback" aria-live="polite"></div>

        <form id="ride-form" class="stack-form two-column-form">
          <div class="route-fields full-width">
            <div class="route-point-field">
              <span class="field-label-row">
                <span>Start point <span class="label-required" aria-hidden="true">*</span></span>
                <button type="button" class="field-inline-action location-picker-trigger" aria-expanded="false"
                  data-picker-target="startPoint">
                  Saved locations
                </button>
              </span>
              <div class="location-picker-panel" data-picker-panel="startPoint" hidden>
                <div class="location-picker-header">
                  <strong>Saved locations</strong>
                  <button type="button" class="location-picker-close" aria-label="Close saved locations">
                    ×
                  </button>
                </div>
                <div class="location-picker-list"></div>
              </div>
              <div class="location-field-row">
                <input type="text" name="startPointDisplay" placeholder="Sintra" autocomplete="off" required />
                <input type="hidden" name="startPoint" />
                <button type="button" class="button-secondary location-map-trigger" data-location-target="startPoint"
                  data-location-label="start point" aria-label="Choose start point on the map">
                  <img src="images/icon_map.svg" alt="" />
                </button>
              </div>
            </div>
            <button type="button" id="swap-route-button" class="button-secondary route-swap-button"
              aria-label="Swap start and end points" title="Swap start and end points">
              <span aria-hidden="true">⇄</span>
            </button>
            <div class="route-point-field">
              <span class="field-label-row">
                <span>End point <span class="label-required" aria-hidden="true">*</span></span>
                <button type="button" class="field-inline-action location-picker-trigger" aria-expanded="false"
                  data-picker-target="endPoint">
                  Saved locations
                </button>
              </span>
              <div class="location-picker-panel" data-picker-panel="endPoint" hidden>
                <div class="location-picker-header">
                  <strong>Saved locations</strong>
                  <button type="button" class="location-picker-close" aria-label="Close saved locations">
                    ×
                  </button>
                </div>
                <div class="location-picker-list"></div>
              </div>
              <div class="location-field-row">
                <input type="text" name="endPointDisplay" placeholder="Lisbon Office" autocomplete="off" required />
                <input type="hidden" name="endPoint" />
                <button type="button" class="button-secondary location-map-trigger" data-location-target="endPoint"
                  data-location-label="end point" aria-label="Choose end point on the map">
                  <img src="images/icon_map.svg" alt="" />
                </button>
              </div>
            </div>
          </div>
          <div class="schedule-fields full-width">
            <div class="schedule-date-row">
              <label>
                Ride date <span class="label-required" aria-hidden="true">*</span>
                <input type="date" name="rideDate" required />
              </label>
              <div class="time-mode-toggle" id="toggle-time-window">
                <button type="button" class="time-mode-option time-mode-option-active" data-time-mode="exact">Exact
                  time</button>
                <button type="button" class="time-mode-option" data-time-mode="window">Time window</button>
              </div>
            </div>
            <div class="schedule-time-inputs">
              <label>
                <span id="start-time-label-text">Departure time</span> <span class="label-required"
                  aria-hidden="true">*</span>
                <input type="time" name="startTime" required step="60" lang="en-GB" />
              </label>
              <label id="end-time-label" hidden>
                Latest departure <span class="label-required" aria-hidden="true">*</span>
                <input type="time" name="endTime" step="60" lang="en-GB" />
              </label>
            </div>
          </div>
          <label>
            Car <span class="label-optional">(optional)</span>
            <input type="text" name="car" placeholder="BMW i4" />
          </label>
          <label>
            Seats available <span class="label-required" aria-hidden="true">*</span>
            <input type="number" name="seatsTotal" min="1" max="8" value="4" required />
          </label>
          <label class="full-width">
            Notes <span class="label-optional">(optional)</span>
            <textarea name="notes" rows="4"
              placeholder="Pickup near the train station at 08:00.&#10;Going through Ponte Vasco da Gama"></textarea>
          </label>
          <button type="submit" class="full-width">Publish ride</button>
        </form>
      </section>
    </main>
  </div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.js"></script>
  <script src="footer.js"></script>
  <script src="app.js"></script>
</body>

</html>
